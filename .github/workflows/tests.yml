name: Tests

# Проверки, которым не нужен контроллер: расчётные тесты правил (Node, без
# зависимостей) и статическая проверка шаблонов Modbus. До этого они
# запускались только руками, и регрессия в правилах или шаблонах
# обнаруживалась уже на железе.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Тестам нужен только код: права токена сужены до чтения.
permissions:
  contents: read

# Несколько пушей подряд в одну ветку — актуален только последний прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тесты правил
        run: |
          for f in tests/*.test.js; do
            case "$f" in
              tests/modbus-template-check.test.js) continue ;; # свой прогон ниже
            esac
            echo "== $f"
            node "$f"
          done

      - name: Проверка шаблонов Modbus
        run: |
          node tests/modbus-template-check.test.js
          # все шаблоны папки: проверяльщик не завязан на имя файла
          node tests/modbus-template-check.js templates/*.json
