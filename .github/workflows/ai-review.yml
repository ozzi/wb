name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex:
    # Секреты на pull_request из форков не передаются + action проверяет
    # write-доступ триггера (check-write-access) — двойной фильтр
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          # явно чекаутим merge-коммит PR (рекомендация codex-action)
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # не оставлять GITHUB_TOKEN в .git/config
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          # LiteLLM как Responses API upstream
          responses-api-endpoint: "https://llm.outzzz.tech/v1/responses"
          openai-api-key: ${{ secrets.LITELLM_REVIEWER_KEY }}
          model: "agent/reviewer"
          codex-version: "0.155.1"
          # bwrap-песочница codex сломана на hosted-раннерах (RTM_NEWADDR,
          # openai/codex#15957); изоляцию обеспечивают drop-sudo (дефолт
          # safety-strategy), отсутствие ключа в окружении агента и
          # эфемерность раннера. Вернуть read-only после фикса апстрима.
          sandbox: "danger-full-access"
          prompt: |
            Ты — строгий, но доброжелательный код-ревьюер проекта Wiren Board.
            Конвенции проекта — см. AGENTS.md в корне репо (codex подгружает его автоматически):
            код в rules/ выполняется движком wb-rules (НЕ Node.js), стиль ECMAScript 5,
            минимальный diff, никакого лишнего рефакторинга.

            Это PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Описание: ${{ github.event.pull_request.body }}

            Ревьюируй ТОЛЬКО изменения PR. Посмотреть их можно так:
            git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            Ты можешь читать любые файлы репо для контекста.

            Формат ответа (markdown, на русском, техтермины в оригинале):
            1. Краткое резюме — 1-2 предложения.
            2. Блоки «🔴 Блокер», «🟡 Замечание», «🟢 Хорошо» (если есть что сказать).
            3. Ссылайся на конкретные файлы и строки.
            4. Если критичных проблем нет — прямо скажи, что PR можно мержить.
            Не выдумывай проблемы ради объёма. Изменения не вноси — ты ревьюер.

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post review comment
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "## 🤖 AI Review — `agent/reviewer` (codex-action)\n\n" + process.env.CODEX_FINAL_MESSAGE,
            });
