name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CODEX_VERSION: "0.155.1"

jobs:
  review:
    # Секреты на pull_request из форков не передаются — тихий skip.
    # Стоимость: гоняем только по лейблу ai-review (kill-switch против
    # случайных прогонов на каждый push)
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # не оставлять GITHUB_TOKEN в .git/config — агент идёт с full access
          persist-credentials: false

      - name: Collect PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --header "Accept: application/vnd.github.diff" > pr.diff
          # Ограничиваем промпт 60KB: режем по границе строки UTF-8 и помечаем усечение
          python3 -c "d=open('pr.diff','rb').read()[:60000]; s=d.decode('utf-8','ignore'); s=(s.rsplit('\n',1)[0]+'\n\n[!] diff усечён до 60KB') if len(d)>60000 else s; open('pr.diff','w').write(s)"
          echo "diff size: $(wc -c < pr.diff) bytes"

      - name: Install Codex CLI
        run: npm install -g "@openai/codex@${CODEX_VERSION}"

      - name: Configure Codex → LiteLLM
        run: |
          mkdir -p ~/.codex
          {
            echo 'model = "agent/reviewer"'
            echo 'model_provider = "litellm"'
            echo ''
            echo '[model_providers.litellm]'
            echo 'name = "LiteLLM"'
            echo 'base_url = "https://llm.outzzz.tech/v1"'
            echo 'env_key = "LITELLM_REVIEWER_KEY"'
            echo 'wire_api = "responses"'
          } > ~/.codex/config.toml

      - name: AI Review (headless Codex)
        env:
          LITELLM_REVIEWER_KEY: ${{ secrets.LITELLM_REVIEWER_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          # danger-full-access: bundled bwrap не работает на hosted-раннерах
          # (RTM_NEWADDR denied), изоляция обеспечивается эфемерностью раннера
          # + минимальными permissions. Diff дублируем в промпт — ревью не
          # зависит от файлового доступа.
          codex exec \
            --sandbox danger-full-access \
            --output-last-message review.md \
            "$(cat .github/review-prompt.md)

            Ревьюируемый PR #${PR_NUMBER}: ${PR_TITLE}
            Описание: ${PR_BODY:-нет описания}

            Diff PR (файл pr.diff, также доступен в корне репо):
            \`\`\`\`diff
            $(cat pr.diff)
            \`\`\`\`"
          RC=$?
          set -e
          echo "codex exit code: $RC"
          [ -s review.md ] || echo "⚠️ Ревьюер не вернул ответ (код $RC, см. логи workflow)" > review.md
          echo "CODEX_RC=$RC" >> "$GITHUB_ENV"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🤖 AI Review — \`agent/reviewer\` (codex headless)"
            echo
            cat review.md
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            -R "${{ github.repository }}" --body-file comment.md
          if [ "${CODEX_RC:-0}" -ne 0 ]; then
            echo "::error::codex exec завершился с кодом $CODEX_RC"
            exit 1
          fi
