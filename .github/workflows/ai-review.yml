name: AI Review

# Ревью PR через PR-Agent: детерминированный single-LLM-call на /review,
# без агентного шелла и песочниц (в отличие от прежнего codex-варианта).
# Модель — LiteLLM-алиас agent/reviewer: алиас, апстрим-модель и дневной
# бюджет-кап управляются на стороне LiteLLM-прокси.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false || github.event_name == 'issue_comment' && github.event.issue.pull_request != null) }}
    runs-on: ubuntu-latest
    # Ревью — один LLM-вызов (~1-2 мин); 10 — потолок против зависаний LiteLLM.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent review
        # Пиннуем точный образ вместо композитного экшена: тот тянет плавающий
        # тег pragent/pr-agent:github_action (FROM без версии в их action.yaml).
        uses: docker://pragent/pr-agent:0.45.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # LiteLLM как OpenAI-совместимый endpoint (/v1/chat/completions);
          # алиас agent/reviewer резолвится на стороне прокси
          OPENAI_KEY: ${{ secrets.LITELLM_REVIEWER_KEY }}
          OPENAI.API_BASE: "https://llm.outzzz.tech/v1"
          config.model: "agent/reviewer"
          config.fallback_models: '["agent/reviewer"]'
          # Русский ответ; в комментарии видно модель/токены/время прогона
          config.response_language: "ru-RU"
          config.output_run_details: "true"
          # Автоматически только /review. Describe/improve выключены ЯВНО:
          # без явных значений раннер запускает все три инструмента.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # Ревью на каждый пуш: synchronize идёт мимо pr_actions и требует
          # handle_push_trigger + push_commands (по умолчанию выключены).
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["review"]'
          # Комментарий ревью обновляется (persistent), а не дублируется на пуш
          pr_reviewer.persistent_comment: "true"
          # В wb-rules-репо нет тестов и тикет-системы — не просить их ревьюить
          pr_reviewer.require_tests_review: "false"
          pr_reviewer.require_ticket_analysis_review: "false"
          pr_reviewer.extra_instructions: |
            Проект — автоматизация Wiren Board на wb-rules (ECMAScript 5: без
            let/const, стрелочных функций, классов, async/await, optional
            chaining, import/export).
            Конвенции из AGENTS.md: минимальный diff, без лишнего рефакторинга,
            предсказуемость и осторожность — код управляет реле и клапанами
            реальной автоматизации. Сомневаешься в API wb-rules — сверяйся с
            документацией Wiren Board Wiki.
            Не ревьюить CI/workflow-инфраструктуру, если она не часть
            изменённого кода правил. Термины и имена API оставляй в оригинале.
